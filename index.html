:root[data-theme="dark"]{

html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
header{padding:14px 16px 6px;max-width:1080px;margin:0 auto}
h1{font:600 24px/1.15 var(--display);margin:0;text-wrap:balance}

nav a{flex:none;padding:10px 10px;color:var(--muted);text-decoration:none;font:500 14px var(--display);border-bottom:3px solid transparent;white-space:nowrap}

main{max-width:1080px;margin:0 auto;padding:14px 16px 60px;display:flex;flex-direction:column;gap:14px}
section,details.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
h2{font:600 17px/1.2 var(--display);margin:0 0 10px;text-wrap:balance}

summary{cursor:pointer;font:600 17px/1.2 var(--display)}

.muted{color:var(--muted);font-size:13px}

button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.x{padding:4px 9px;color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}

.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.gap{color:var(--warn);font-weight:600;cursor:help}

.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;display:none;z-index:9;max-width:90vw}

function retention(st){
  const mi=MICRO.find(x=>x.id===st.micro)||MICRO[0], ma=MACRO[st.macro]||MACRO.none;
  const R=Object.assign({prot:ma.v[0],fat:ma.v[1],carb:ma.v[2]},mi.v,st.ret||{});
  R.ash=(R.na+R.k+R.ca+R.mg+R.p)/5;
  return R;
}
function compute(st, lookup){
  const items=st.items.map(it=>({f:lookup(it.fid),m:+it.m||0})).filter(x=>x.f&&x.m>0);
  const M=items.reduce((s,x)=>s+x.m,0), R=retention(st);
  const Mout=M*(+st.yield||100)/100;
  const raw={},fin={},cov={},miss={};
  for(const k of ALLK){
    let a=0,c=0; const ms=[];
    for(const x of items){ const v=fv(x.f,k); if(v==null) ms.push(x.f.name); else { a+=x.m*v/100; c+=x.m; } }
    raw[k]=a; cov[k]=M?c/M:1; miss[k]=ms;
    const r=META[k].r; fin[k]=a*(r?R[r]:100)/100;
  }
  raw.protAA=items.reduce((t,x)=>t+(fv(x.f,'lys')==null?0:x.m*(fv(x.f,'prot')||0)/100),0); fin.protAA=raw.protAA*R.prot/100;
  raw.ne=raw.b3+raw.trp*1000/60; fin.ne=fin.b3+fin.trp*1000/60; cov.ne=Math.min(cov.b3,cov.trp); miss.ne=miss.b3;
  fin.water=Mout-(fin.prot+fin.fat+fin.carb+fin.fib+fin.ash+fin.alc);
  const per=(o,m)=>{const r={}; for(const k in o) r[k]=m?o[k]/m*100:0; return r;};
  return {items,M,Mout,R,raw,fin,cov,miss,raw100:per(raw,M),fin100:per(fin,Mout),waterNeg:fin.water<-1e-9};
}

function proteinQuality(p, refKey){
  const ref=AAREF[refKey].v, P=(p.protAA>0?p.protAA:p.prot); if(!(P>0)) return null;
  const g={his:p.his,ile:p.ile,leu:p.leu,lys:p.lys,saa:p.met+p.cys,aaa:p.phe+p.tyr,thr:p.thr,trp:p.trp,val:p.val};
  const rows=Object.keys(ref).map(k=>{ const a=g[k]/P*1000; return {k,n:AAN[k],g:g[k],a,e:ref[k],c:a/ref[k]}; });
  const cmin=Math.min(...rows.map(r=>r.c)), lim=rows.find(r=>r.c===cmin), n=rows.length;
  const kras=rows.reduce((s,r)=>s+(r.c-cmin),0)/n*100;
  const sumA=rows.reduce((s,r)=>s+r.a,0), sumE=rows.reduce((s,r)=>s+r.e,0);
  const util=sumA?cmin*sumE/sumA:0;
  const sigma=cmin?rows.reduce((s,r)=>s+(r.a-cmin*r.e),0)/cmin/10:0;
  const eaai=Math.pow(rows.reduce((s,r)=>s*Math.max(Math.min(r.c,1),0.01),1),1/n)*100;
  const ess=p.val+p.ile+p.leu+p.lys+p.met+p.thr+p.trp+p.phe+p.his;
  const non=p.arg+p.ala+p.asp+p.glut+p.gly+p.pro+p.ser+p.cys+p.tyr+(p.hyp||0);
  return {rows,cmin,lim,kras,bv:100-kras,util,sigma,eaai,ess,non,P,share:p.prot>0?P/p.prot:1,trpHyp:p.hyp>0?p.trp/p.hyp:null};
}
function lipidIndices(p, kcal){
  const s=p.sfa,m=p.mufa,u=p.pufa,n3=p.n3,n6=p.n6, d=(a,b)=>b>0?a/b:null;

  return { s,m,u,n3,n6, ratio:s>0?[1,m/s,u/s]:null, n6n3:d(n6,n3), ps:d(u,s),
    ai:d(p.c12+4*p.c14+p.c16,m+u), ti:d(p.c14+p.c16+p.c18,tiDen),

}

/* ---------- белок ---------- */
function vProtein(C){

  return `<section><label class="f" style="max-width:360px">Эталонный белок<select id="aaref">${Object.keys(AAREF).map(k=>`<option value="${k}" ${k===ST.aaref?'selected':''}>${AAREF[k].n}</option>`).join('')}</select></label></section>
  <div class="tiles">

   <div class="tile"><b>${fmt(q.kras,1)}%</b><span>КРАС (разбалансированность)</span></div>
   <div class="tile"><b>${fmt(q.bv,1)}%</b><span>биологическая ценность = 100 − КРАС</span></div>
   <div class="tile"><b>${fmt(q.util,2)}</b><span>коэффициент утилитарности U</span></div>
   <div class="tile"><b>${fmt(q.sigma,2)}</b><span>сопоставимая избыточность σ, г/100 г белка эталона</span></div>
   <div class="tile"><b>${fmt(q.eaai,0)}</b><span>индекс незаменимых аминокислот (EAAI)</span></div>
   <div class="tile"><b>${fmt(q.ess,2)} г</b><span>сумма незаменимых в 100 г готового</span></div>
   <div class="tile"><b>${fmt(q.non?q.ess/q.non:null,2)}</b><span>незаменимые : заменимые</span></div>
   ${q.trpHyp!=null?`<div class="tile"><b>${fmt(q.trpHyp,2)}</b><span>триптофан : оксипролин (БКП)</span></div>`:''}
  </div>
  ${q.share<0.999?`<div class="note">Для части ингредиентов в справочнике нет аминокислотного состава. Показатели качества белка рассчитаны по ингредиентам с данными: это ${fmt(q.share*100,0)}% белка рецептуры.</div>`:''}
  <section><h2>Аминокислотный скор, готовый продукт</h2>
   <div class="tw"><table><thead><tr><th>Аминокислота</th><th>г в 100 г продукта</th><th>мг на 1 г белка</th><th>Эталон, мг/г</th><th>Скор, %</th><th>0–200%</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="muted">Скор сырья и готового продукта совпадает (${fmt(qr.cmin*100,0)}%), потому что потери всех аминокислот приняты равными потерям белка. Вертикальная черта на шкале: 100%.</p>${gapsNote(C,ORDER.aa)}</section>
  <section><h2>Полный аминокислотный состав</h2>
   <div class="tw"><table><thead><tr><th>Аминокислота</th><th>Сырьё, г/100 г</th><th>Готовый, г/100 г</th><th>Порция, г</th><th>мг на 1 г белка</th></tr></thead><tbody>
   <tr class="sum"><td>Белок</td><td>${fmt(C.raw100.prot,2)}</td><td>${fmt(C.fin100.prot,2)}</td><td>${fmt(C.fin100.prot*ST.portion/100,2)}</td><td>1000</td></tr>${all}</tbody></table></div>${gapsNote(C,ORDER.naa)}</section>`;
}

/* ---------- жиры ---------- */
function vLipids(C){

  const sumFA=L.sumFA||1;
  const grp=(c,t,tot)=>{ const ks=ORDER.fa.filter(k=>META[k].c===c&&(C.raw100[k]>0.0005));
    return `<tr class="sum"><td>${t}</td><td>${fmt(C.raw100[tot],3)}</td><td>${fmt(p[tot],3)}</td><td>${fmt(p[tot]*ST.portion/100,3)}</td><td>${fmt(p[tot]/sumFA*100,1)}</td></tr>`+
    ks.map(k=>`<tr><td class="sub">${META[k].n}${gapMark(C,k)}</td><td>${fmt(C.raw100[k],3)}</td><td>${fmt(p[k],3)}</td><td>${fmt(p[k]*ST.portion/100,3)}</td><td>${fmt(p[k]/sumFA*100,1)}</td></tr>`).join(''); };
  return `<div class="tiles">
   <div class="tile"><b>${L.ratio?`1 : ${fmt(L.ratio[1],2)} : ${fmt(L.ratio[2],2)}`:'–'}</b><span>НЖК : МНЖК : ПНЖК</span></div>
   <div class="tile"><b>${L.n6n3!=null?rg(L.n6n3,null,10,1)+' : 1':'–'}</b><span>ω-6 : ω-3 (рекомендуется 5–10 : 1)</span></div>
   <div class="tile"><b>${rg(L.ps,0.4,null)}</b><span>ПНЖК / НЖК (желательно не ниже 0,4)</span></div>
   <div class="tile"><b>${rg(L.ai,null,1)}</b><span>индекс атерогенности (ИА)</span></div>
   <div class="tile"><b>${rg(L.ti,null,1)}</b><span>индекс тромбогенности (ИТ)</span></div>
   <div class="tile"><b>${rg(L.hH,2,null)}</b><span>гипо- / гиперхолестеринемические кислоты (h/H)</span></div>
   <div class="tile"><b>${fmt(p.chl,0)} мг</b><span>холестерин в 100 г готового</span></div></div>
  <section><h2>Доля энергии от жирных кислот, готовый продукт</h2>
   <div class="tw"><table><thead><tr><th>Группа</th><th>% энергии</th><th>Ориентир МР 2.3.1.0253-21 для рациона</th></tr></thead><tbody>
   <tr><td>НЖК</td><td>${rg(L.eS,null,10,1)}</td><td>не более 10%</td></tr><tr><td>МНЖК</td><td>${fmt(L.eM,1)}</td><td>около 10%</td></tr>
   <tr><td>ПНЖК</td><td>${rg(L.eU,6,10,1)}</td><td>6–10%</td></tr><tr><td>ω-6</td><td>${rg(L.e6,5,8,1)}</td><td>5–8%</td></tr>
   <tr><td>ω-3</td><td>${rg(L.e3,1,2,1)}</td><td>1–2%</td></tr><tr><td>Трансизомеры${gapMark(C,'trans')}</td><td>${rg(L.eT,null,1,2)}</td><td>не более 1%</td></tr></tbody></table></div>
   <p class="muted">Ориентиры относятся к суточному рациону, для отдельного продукта это справочное сравнение.</p></section>
  <section><h2>Жирнокислотный состав</h2>
   <div class="tw"><table><thead><tr><th>Кислота</th><th>Сырьё, г/100 г</th><th>Готовый, г/100 г</th><th>Порция, г</th><th>% от суммы ЖК</th></tr></thead><tbody>
   <tr class="sum"><td>Жир общий</td><td>${fmt(C.raw100.fat,2)}</td><td>${fmt(p.fat,2)}</td><td>${fmt(p.fat*ST.portion/100,2)}</td><td></td></tr>
   ${grp('s','Насыщенные (НЖК)','sfa')}${grp('m','Мононенасыщенные (МНЖК)','mufa')}${grp('p','Полиненасыщенные (ПНЖК)','pufa')}
   <tr><td>ω-6 ПНЖК${gapMark(C,'n6')}</td><td>${fmt(C.raw100.n6,3)}</td><td>${fmt(p.n6,3)}</td><td>${fmt(p.n6*ST.portion/100,3)}</td><td>${fmt(p.n6/sumFA*100,1)}</td></tr>
   <tr><td>ω-3 ПНЖК${gapMark(C,'n3')}</td><td>${fmt(C.raw100.n3,3)}</td><td>${fmt(p.n3,3)}</td><td>${fmt(p.n3*ST.portion/100,3)}</td><td>${fmt(p.n3/sumFA*100,1)}</td></tr>
   <tr><td>Трансизомеры${gapMark(C,'trans')}</td><td>${fmt(C.raw100.trans,3)}</td><td>${fmt(p.trans,3)}</td><td>${fmt(p.trans*ST.portion/100,3)}</td><td></td></tr>
   <tr><td>Холестерин, мг</td><td>${fmt(C.raw100.chl,0)}</td><td>${fmt(p.chl,0)}</td><td>${fmt(p.chl*ST.portion/100,0)}</td><td></td></tr>
   <tr><td>Фитостерины, мг${gapMark(C,'phyto')}</td><td>${fmt(C.raw100.phyto,0)}</td><td>${fmt(p.phyto,0)}</td><td>${fmt(p.phyto*ST.portion/100,0)}</td><td></td></tr>
   </tbody></table></div>${gapsNote(C,['sfa','mufa','pufa','n3','n6','trans','phyto'])}

}

/* ---------- маркировка ---------- */
function vLabel(C){
  const p=C.fin100, e=energy(p), N=NORMS.tr.v;
  const comp=C.items.slice().sort((a,b)=>b.m-a.m).map(x=>x.f.name.split(',')[0].split('(')[0].trim().toLowerCase());
  const uniq=[...new Set(comp)];
  const mk=['ca','p','fe','mg','zn','k','se','va','vd','ve','vc','b1','b2','ne','b6','fol','b12','b5'];
  const micro=mk.map(k=>({k,pc:p[k]/N[k]*100})).filter(x=>x.pc>=5).sort((a,b)=>b.pc-a.pc);
  const claims=[]; const pe=p.prot*4/e.kcal*100;
  if(pe>=20) claims.push('Высокое содержание белка: белок даёт '+fmt(pe,0)+'% энергии (порог 20%)'); else if(pe>=12) claims.push('Источник белка: белок даёт '+fmt(pe,0)+'% энергии (порог 12%)');
  if(p.fib>=6) claims.push('Высокое содержание пищевых волокон: '+fmt(p.fib,1)+' г/100 г (порог 6 г)'); else if(p.fib>=3) claims.push('Источник пищевых волокон: '+fmt(p.fib,1)+' г/100 г (порог 3 г)');
  micro.forEach(x=>{ if(x.pc>=30) claims.push('Высокое содержание: '+META[x.k].n.toLowerCase()+', '+fmt(x.pc,0)+'% суточной потребности в 100 г (порог 30%)'); else if(x.pc>=15) claims.push('Источник: '+META[x.k].n.toLowerCase()+', '+fmt(x.pc,0)+'% суточной потребности в 100 г (порог 15%)'); });
  return `<section><h2>Пищевая ценность для этикетки, на 100 г готового продукта</h2>
   <div class="tw"><table><thead><tr><th>Показатель</th><th>Расчёт</th><th>С округлением по ТР ТС 022/2011</th><th>% суточной потребности</th></tr></thead><tbody>
   <tr><td>Белки, г</td><td>${fmt(p.prot,2)}</td><td>${fmt(roundMacroTR(p.prot))}</td><td>${fmt(p.prot/N.prot*100,0)}%</td></tr>
   <tr><td>Жиры, г</td><td>${fmt(p.fat,2)}</td><td>${fmt(roundMacroTR(p.fat))}</td><td>${fmt(p.fat/N.fat*100,0)}%</td></tr>
   <tr><td>Углеводы, г</td><td>${fmt(p.carb,2)}</td><td>${fmt(roundMacroTR(p.carb))}</td><td>${fmt(p.carb/N.carb*100,0)}%</td></tr>
   <tr><td>Энергетическая ценность, ккал</td><td>${fmt(e.kcal,1)}</td><td>${fmt(roundEnergyTR(e.kcal),0)}</td><td>${fmt(e.kcal/N.kcal*100,0)}%</td></tr>
   <tr><td>Энергетическая ценность, кДж</td><td>${fmt(e.kj,1)}</td><td>${fmt(roundEnergyTR(e.kj),0)}</td><td></td></tr></tbody></table></div>
   <p class="muted">Коэффициенты: белки 4 ккал/г (17 кДж), жиры 9 (37), углеводы 4 (17), пищевые волокна 2 (8), спирт 7 (29).</p></section>
  <section><h2>Состав в порядке убывания массовой доли</h2><p>${esc(uniq.join(', '))||'–'}</p>
   <p class="muted">Черновик по названиям из справочника. Отредактируйте наименования по своим ТУ или СТО.</p></section>
  <section><h2>Витамины и минеральные вещества от 5% суточной потребности</h2>
   ${micro.length?`<div class="tw"><table><thead><tr><th>Вещество</th><th>В 100 г</th><th>% суточной потребности</th></tr></thead><tbody>${micro.map(x=>`<tr><td>${META[x.k].n}${gapMark(C,x.k==='ne'?'b3':x.k)}</td><td>${fmt(p[x.k],META[x.k].d)} ${META[x.k].u}</td><td>${fmt(x.pc,0)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Нет веществ выше порога 5%.</p>'}</section>
  <section><h2>Возможные заявления об отличительных признаках</h2>
   ${claims.length?'<ul>'+claims.map(c=>`<li>${c}</li>`).join('')+'</ul>':'<p class="muted">Пороги приложения 5 ТР ТС 022/2011 не достигнуты.</p>'}
   <div class="note">Расчётные значения служат основой для маркировки. Заявления на этикетке подтверждают лабораторными испытаниями готового продукта.</div></section>`;
}

/* ---------- методика ---------- */
function vMethod(){ return `<section class="prose"><h2>Как считает калькулятор</h2>
 <p><b>Сырьё.</b> Количество каждого вещества в закладке: сумма по ингредиентам <code>m · c / 100</code>, где m – масса нетто, г; c – содержание в 100 г по справочнику. Состав на 100 г сырья: сумма, делённая на массу закладки.</p>
 <p><b>Готовый продукт.</b> Количество вещества умножается на коэффициент сохранности выбранного способа обработки, затем делится на массу готового продукта (закладка × выход). Влага готового продукта: масса готового минус белки, жиры, углеводы, волокна, зола и спирт после обработки.</p>
 <p><b>Углеводы.</b> Усвояемые углеводы = углеводы по разности минус пищевые волокна. Крахмал и другие полисахариды по разности = усвояемые углеводы минус сахара.</p>
 <p><b>Энергия.</b> По ТР ТС 022/2011: белки 4, жиры 9, углеводы 4, пищевые волокна 2, спирт 7 ккал/г.</p>
 <p><b>Белок.</b> Скор <code>C = A / A<sub>э</sub></code>, где A – мг аминокислоты на 1 г белка, A<sub>э</sub> – то же в эталоне. КРАС = среднее по незаменимым аминокислотам (C − C<sub>min</sub>), %. Биологическая ценность = 100 − КРАС. Коэффициент утилитарности <code>U = C<sub>min</sub> · ΣA<sub>э</sub> / ΣA</code>. Сопоставимая избыточность <code>σ = Σ(A − C<sub>min</sub>·A<sub>э</sub>) / C<sub>min</sub></code> (Липатов Н. Н.). EAAI – среднее геометрическое скоров, ограниченных 100% (Oser).</p>
 <p><b>Жиры.</b> ИА = (C12:0 + 4·C14:0 + C16:0) / (МНЖК + ПНЖК). ИТ = (C14:0 + C16:0 + C18:0) / (0,5·МНЖК + 0,5·ω-6 + 3·ω-3 + ω-3/ω-6) (Ulbricht, Southgate, 1991). h/H = (C18:1 + C18:2 + C18:3 + C20:4 + C20:5 + C22:5 + C22:6) / (C14:0 + C16:0). ω-3 = α-линоленовая + C18:4 + ЭПК + ДПК + ДГК; ω-6 = линолевая + γ-линоленовая + C20:2 + C20:3 + арахидоновая.</p>
 <h2>Источники данных</h2>
 <ul><li><b>Состав продуктов:</b> USDA National Nutrient Database for Standard Reference, выпуск 26 (общественное достояние). ${DB.foods.length} видов сырья переведены на русский язык, ещё 8 058 доступны в расширенной базе на английском.</li>
 <li><b>Потери белков, жиров, углеводов:</b> обобщённые величины по Скурихину (МУ 4237-86): в среднем 6, 12 и 9%; животное сырьё 8 и 25%; растительное 5, 6 и 9%.</li>
 <li><b>Обобщённая сохранность минеральных веществ и витаминов по Скурихину:</b> потери Ca 12 (10 растительное, 15 животное), Mg и P 13 (10 и 20), витамин C 60%. Для Fe 13, A 40, β-каротина 20, B1 28, B2 20, PP 20% использованы обобщённые величины, которые обычно приводят со ссылкой на справочник: сверьте их с печатным изданием.</li>
 <li><b>Сохранность по способам обработки:</b> USDA Table of Nutrient Retention Factors, выпуск 6 (2007).</li>
 <li><b>Нормы:</b> ТР ТС 022/2011 (приложения 2–5), МР 2.3.1.0253-21. Эталоны белка: ФАО/ВОЗ 1973, ФАО/ВОЗ/УООН 2007, ФАО 2013.</li></ul>
 <h2>Ограничения</h2>
 <ul><li>Таблицы Скурихина и Тутельяна (2002) в машиночитаемом виде не публикуются, поэтому числовая основа базы – USDA. Состав российского сырья может отличаться: породы, корма, сорта, разделка. Для точной работы добавляйте свои продукты по Скурихину или по протоколам испытаний во вкладке «Справочник».</li>
 <li>Значок ◐ означает, что для части ингредиентов в справочнике нет данных по этому веществу; итог занижен.</li>
 <li>Ориентировочные выходы взяты из практики общественного питания и служат подсказкой. Фактический выход задаёт ваша технология.</li>
 <li>Коэффициенты сохранности применяются ко всей рецептуре сразу. Жир, впитанный при жарке, учитывайте как ингредиент.</li>
 <li>Расчёт не заменяет лабораторные испытания при подтверждении показателей для маркировки.</li></ul></section>`; }

/* ---------- экспорт ---------- */
function sheets(C){
  const er=energy(C.raw100), ef=energy(C.fin100), por=ST.portion/100;
  const A=[['Рецептура',ST.name],['Ингредиент','Масса, г','Доля, %']].concat(C.items.map(x=>[x.f.name,x.m,+(x.m/C.M*100).toFixed(2)]),[['Итого',C.M,100],[],['Выход, %',+ST.yield],['Масса готового продукта, г',+C.Mout.toFixed(1)],['Способ обработки',(MICRO.find(m=>m.id===ST.micro)||{}).n],['Потери БЖУ',MACRO[ST.macro].n],[],['Коэффициент сохранности, %']],RP.map(r=>[r[1],C.R[r[0]]]));
  const H=['Показатель','Ед.','Сырьё, на 100 г','Готовый продукт, на 100 г','Порция '+ST.portion+' г','Охват данными, % массы'];
  const rw=k=>[META[k].n,META[k].u,+C.raw100[k].toFixed(4),+C.fin100[k].toFixed(4),+(C.fin100[k]*por).toFixed(4),+(C.cov[k]*100).toFixed(0)];
  const B=[H,['Энергетическая ценность','ккал',+er.kcal.toFixed(1),+ef.kcal.toFixed(1),+(ef.kcal*por).toFixed(1),''],['Энергетическая ценность','кДж',+er.kj.toFixed(1),+ef.kj.toFixed(1),+(ef.kj*por).toFixed(1),'']].concat(ORDER.main.map(rw),[['Углеводы']],ORDER.carb.map(rw),[['Минеральные вещества']],ORDER.min.map(rw),[['Витамины']],ORDER.vit.map(rw));
  const q=proteinQuality(C.fin100,ST.aaref);
  const P=[H].concat(ORDER.aa.concat(ORDER.naa).map(rw));
  if(q){ P.push([],['Эталон',AAREF[ST.aaref].n],['Аминокислота','мг/г белка','Эталон, мг/г','Скор, %']); q.rows.forEach(r=>P.push([r.n,+r.a.toFixed(2),r.e,+(r.c*100).toFixed(1)]));
    P.push([],['Лимитирующая аминокислота',q.lim.n],['Минимальный скор, %',+(q.cmin*100).toFixed(1)],['КРАС, %',+q.kras.toFixed(2)],['Биологическая ценность, %',+q.bv.toFixed(2)],['Коэффициент утилитарности',+q.util.toFixed(3)],['Сопоставимая избыточность, г/100 г белка',+q.sigma.toFixed(2)],['EAAI',+q.eaai.toFixed(1)]); }
  const L=lipidIndices(C.fin100,ef.kcal), n=v=>v==null?'':+v.toFixed(3);
  const F=[H].concat(ORDER.lip.map(rw),ORDER.fa.filter(k=>C.raw100[k]>0).map(rw),[[],['Показатели (готовый продукт)'],['НЖК : МНЖК : ПНЖК',L.ratio?L.ratio.map(x=>x.toFixed(2)).join(' : '):''],['ω-6 : ω-3',n(L.n6n3)],['ПНЖК / НЖК',n(L.ps)],['Индекс атерогенности',n(L.ai)],['Индекс тромбогенности',n(L.ti)],['h/H',n(L.hH)]]);
  return [['Рецептура',A],['Состав',B],['Аминокислоты',P],['Жирные кислоты',F]];
}
async function saveFile(filename,data,mime){
  try{ if(window.claude&&window.claude.use){ const d=await window.claude.use('downloads'); if(d){ await d.save({filename,data}); return true; } } }catch(e){ if(e&&e.code==='declined') return false; }
  try{ const b=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); return true; }catch(e){ return false; }
}
async function exportXlsx(){ if(typeof XLSX==='undefined'){ toast('Библиотека Excel не загрузилась. Используйте «Скопировать таблицу состава».'); return; }
  const wb=XLSX.utils.book_new(); sheets(compute(ST,lookup)).forEach(s=>{ const ws=XLSX.utils.aoa_to_sheet(s[1]); ws['!cols']=[{wch:42},{wch:14},{wch:18},{wch:24},{wch:16},{wch:22}]; XLSX.utils.book_append_sheet(wb,ws,s[0]); });
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const ok=await saveFile((ST.name||'recipe').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,60)+'.xlsx',new Blob([buf]),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast(ok?'Файл Excel подготовлен.':'Сохранение отменено или недоступно здесь.'); }
function copyTable(){ const t=sheets(compute(ST,lookup)).map(s=>s[0]+'\n'+s[1].map(r=>r.join('\t')).join('\n')).join('\n\n');
  navigator.clipboard.writeText(t).then(()=>toast('Таблицы скопированы: вставьте в Excel.'),()=>toast('Браузер не разрешил копирование.')); }

/* ---------- события ---------- */
function addItem(id){ const it=ST.items.find(x=>x.fid===id); if(it) it.m=(+it.m||0)+100; else ST.items.push({fid:id,m:100}); save(); toast('Добавлено в рецептуру: '+FOODS.get(id).name); }
document.addEventListener('input',e=>{ const t=e.target;
  if(t.id==='q'){ const r=t.value.trim().length<2?[]:findFoods(t.value,'',15);
    $('#found').innerHTML=r.map(f=>`<button data-add="${f.id}" data-rerender="1"><span>${esc(f.name)}</span><small>${fmt(fv(f,'prot'),1)} / ${fmt(fv(f,'fat'),1)} / ${fmt(fv(f,'carb')||0,1)}</small></button>`).join('')||(t.value.trim().length<2?'':'<button disabled>Не найдено. Добавьте свой продукт во вкладке «Справочник».</button>'); }
  if(t.id==='bq'){ BASEQ=t.value; baseList(); }
});
document.addEventListener('change',e=>{ const t=e.target, v=parseFloat(t.value);
  if(t.dataset.mass!=null){ ST.items[+t.dataset.mass].m=v>0?v:0; }
  else if(t.id==='rname'){ ST.name=t.value; save(); return; }
  else if(t.id==='micro'){ ST.micro=t.value; const m=MICRO.find(x=>x.id===t.value); ST.macro=m.m; if(m.y) ST.yield=m.y; ST.ret={}; }
  else if(t.id==='macro'){ ST.macro=t.value; if(ST.ret){ delete ST.ret.prot; delete ST.ret.fat; delete ST.ret.carb; } }
  else if(t.id==='yield'){ if(v>0) ST.yield=v; }
  else if(t.id==='mout'){ const C=compute(ST,lookup); if(v>0&&C.M>0) ST.yield=+(v/C.M*100).toFixed(2); }
  else if(t.id==='portion'){ if(v>0) ST.portion=v; }
  else if(t.dataset.ret){ if(v>=0){ ST.ret=ST.ret||{}; ST.ret[t.dataset.ret]=v; } }
  else if(t.id==='norm'){ ST.norm=t.value; }
  else if(t.id==='aaref'){ ST.aaref=t.value; }
  else if(t.id==='bcat'){ BASECAT=t.value; baseList(); return; }
  else if(t.id==='impUser'){ const f=t.files[0]; if(!f) return; f.text().then(s=>{ try{ const arr=JSON.parse(s); let n=0; arr.forEach(u=>{ if(u&&u.name&&u.v){ u.id='u'+Date.now()+(n++); USER.push(u); FOODS.set(u.id,userToFood(u)); } }); LS.set('user',USER); toast('Загружено продуктов: '+n); render(); }catch(err){ toast('Файл не прочитан: нужен JSON, выгруженный из этого калькулятора.'); } }); return; }
  else return;
  save(); render();
});
document.addEventListener('click',e=>{ const t=e.target.closest('[data-add],[data-del],[data-act],[data-show],[data-deluser]'); if(!t) return;
  if(t.dataset.add){ addItem(t.dataset.add); if(t.dataset.rerender) render(); return; }
  if(t.dataset.del!=null){ ST.items.splice(+t.dataset.del,1); save(); render(); return; }
  if(t.dataset.show){ e.preventDefault(); baseDetail(t.dataset.show); return; }
  if(t.dataset.deluser){ const id=t.dataset.deluser; USER=USER.filter(u=>u.id!==id); LS.set('user',USER); FOODS.delete(id); ST.items=ST.items.filter(i=>i.fid!==id); save(); render(); return; }
  const a=t.dataset.act, rec=LS.get('recipes',[]);
  if(a==='saveRecipe'){ save(); const i=rec.findIndex(r=>r.name===ST.name); const c=JSON.parse(JSON.stringify(ST)); if(i>=0) rec[i]=c; else rec.push(c); LS.set('recipes',rec); toast('Рецептура сохранена в этом браузере.'); render(); }
  else if(a==='loadRecipe'||a==='delRecipe'){ const i=$('#savedSel').value; if(i==='') return; if(a==='delRecipe'){ rec.splice(+i,1); LS.set('recipes',rec); } else { ST=JSON.parse(JSON.stringify(rec[+i])); ST.items.forEach(it=>{ if(!FOODS.has(it.fid)&&it.snap) FOODS.set(it.fid,it.snap); }); ST.items=ST.items.filter(it=>FOODS.has(it.fid)); save(); } render(); }
  else if(a==='newRecipe'){ ST=Object.assign(JSON.parse(JSON.stringify(EXAMPLE)),{name:'Новая рецептура',items:[],micro:'none',macro:'none',yield:100}); save(); render(); }
  else if(a==='example'){ ST=JSON.parse(JSON.stringify(EXAMPLE)); save(); render(); }
  else if(a==='scale'){ const v=parseFloat($('#scaleTo').value), C=compute(ST,lookup); if(v>0&&C.M>0){ const k=v/C.M; ST.items.forEach(i=>i.m=+(i.m*k).toFixed(3)); save(); render(); } }
  else if(a==='resetRet'){ ST.ret={}; save(); render(); }
  else if(a==='xlsx') exportXlsx();
  else if(a==='copy') copyTable();
  else if(a==='loadFull'){ t.disabled=true; t.textContent='Загрузка...'; const s=document.createElement('script'); s.src='usda_full.js';
    s.onload=()=>{ const U=window.USDA_FULL; U.foods.forEach(x=>FOODS.set('r'+x[0],{id:'r'+x[0],name:x[1],cat:'USDA: '+U.groups[x[2]],en:'',v:x[3],src:'en'})); fullLoaded=true; toast('Расширенная база подключена.'); render(); };
    s.onerror=()=>{ t.disabled=false; t.textContent='Не удалось загрузить. Повторить'; }; document.head.appendChild(s); }
  else if(a==='addUser'){ const name=$('#u_name').value.trim(); if(!name){ toast('Укажите название продукта.'); return; } const v={};
    ALLK.forEach(k=>{ const el=$('#u_'+k); if(el&&el.value!==''){ const x=parseFloat(el.value); if(x>=0) v[k]=x; } });
    if(v.prot==null||v.fat==null||v.water==null){ toast('Заполните хотя бы воду, белки и жиры.'); return; }
    if(v.carb==null) v.carb=0; const u={id:'u'+Date.now(),name,v}; USER.push(u); LS.set('user',USER); FOODS.set(u.id,userToFood(u)); toast('Продукт сохранён в этом браузере.'); render(); }
  else if(a==='expUser'){ if(!USER.length){ toast('Своих продуктов пока нет.'); return; } saveFile('svoi-produkty.json',JSON.stringify(USER.map(u=>({name:u.name,v:u.v})),null,1),'application/json').then(ok=>toast(ok?'Файл подготовлен.':'Сохранение отменено или недоступно здесь.')); }
});
render();
</script>
